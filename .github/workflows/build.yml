name: Build deb
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: [ rootful, rootless ]
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build rootful
        if: matrix.scheme == 'rootful'
        run: make package FINALPACKAGE=1
      - name: Build rootless
        if: matrix.scheme == 'rootless'
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: ZaloXposediOS-${{ matrix.scheme }}
          path: packages/*.deb
